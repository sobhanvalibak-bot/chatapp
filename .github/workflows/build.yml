name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["chatapp.zip", ".github/workflows/build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q chatapp.zip -d src
          # اگه زیپ یه پوشه‌ی بیرونی داشت (مثلا chatapp/)، همونو پیدا کن
          if [ ! -d src/app ]; then
            d=$(dirname "$(find src -maxdepth 3 -type d -name app | head -1)")
            mv "$d" src_fixed && rm -rf src && mv src_fixed src
          fi
          ls src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create android scaffold
        working-directory: src/app
        run: flutter create . --platforms=android --project-name chat_app --org com.example

      - name: Patch manifest and minSdk
        working-directory: src/app/android/app
        run: |
          python3 - << 'PY'
          import re, glob
          m = "src/main/AndroidManifest.xml"
          s = open(m, encoding="utf-8").read()
          perms = ["INTERNET","POST_NOTIFICATIONS","READ_MEDIA_IMAGES","READ_MEDIA_VIDEO",
                   "READ_MEDIA_AUDIO","READ_EXTERNAL_STORAGE","WRITE_EXTERNAL_STORAGE",
                   "RECORD_AUDIO","CAMERA","WAKE_LOCK","FOREGROUND_SERVICE",
                   "FOREGROUND_SERVICE_MEDIA_PLAYBACK"]
          add = "".join(f'    <uses-permission android:name="android.permission.{p}"/>\n' for p in perms)
          s = s.replace("<application", add + "    <application", 1)
          s = s.replace('android:label="chat_app"', 'android:usesCleartextTraffic="true" android:label="Chat"', 1)
          open(m, "w", encoding="utf-8").write(s)
          for g in glob.glob("build.gradle*"):
              t = open(g).read()
              t = re.sub(r"minSdk(Version)?\s*=?\s*flutter\.minSdkVersion", "minSdk = 24", t)
              open(g, "w").write(t)
          PY

      - name: Setup signing
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        working-directory: src/app/android
        run: |
          if [ -f ../../release.p12 ] && [ -n "$STORE_PASS" ]; then
            cp ../../release.p12 app/release.p12
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n" "$STORE_PASS" "$STORE_PASS" "$KEY_ALIAS" > key.properties
            python3 - << 'PY'
          import glob
          g = glob.glob("app/build.gradle.kts")
          if g:
              p = g[0]; t = open(p).read()
              t = 'import java.util.Properties\n' + t
              t = t.replace("android {", '''val ksProps = Properties().apply { load(rootProject.file("key.properties").inputStream()) }
          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("release.p12")
                      storeType = "pkcs12"
                      storePassword = ksProps["storePassword"] as String
                      keyAlias = ksProps["keyAlias"] as String
                      keyPassword = ksProps["keyPassword"] as String
                  }
              }''', 1)
              t = t.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              open(p, "w").write(t)
          else:
              p = "app/build.gradle"; t = open(p).read()
              t = t.replace("android {", '''def ksProps = new Properties()
          ksProps.load(new FileInputStream(rootProject.file("key.properties")))
          android {
              signingConfigs {
                  release {
                      storeFile file("release.p12")
                      storeType "pkcs12"
                      storePassword ksProps["storePassword"]
                      keyAlias ksProps["keyAlias"]
                      keyPassword ksProps["keyPassword"]
                  }
              }''', 1)
              t = t.replace("signingConfigs.debug", "signingConfigs.release")
              open(p, "w").write(t)
          PY
          else
            echo "::warning::release.p12 یا KEYSTORE_PASSWORD نیست؛ با کلید debug امضا میشه"
          fi

      - name: Build APK
        working-directory: src/app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: chat-apk
          path: src/app/build/app/outputs/flutter-apk/app-release.apk
